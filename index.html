<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        padding: 20px;
        background-color: #f9f9f9;
      }

      * {
        box-sizing: border-box;
      }

      .products-wrapper {
        max-width: 1024px;
        width: 100%;
        margin: 20px auto;
      }

      .search-value {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid #ccc;
        border-radius: 4px;
        outline: none;
        font-size: 16px;
      }

      .products {
        margin-top: 24px;
        display: flex;
        justify-content: space-between;
        align-items: start;
        gap: 20px;
      }

      .products-list {
        max-width: 800px;
        width: 100%;
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
      }

      .cart-summary {
        width: 200px;
        min-height: 100px;
        padding: 16px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background-color: #fff;
        position: sticky;
        top: 20px;
      }

      .card {
        width: calc(50% - 6px);
        min-height: 160px;
        padding: 16px;
        border: 1px solid #e0e0e0;
        border-radius: 6px;
        background-color: #fff;
        display: flex;
        column-gap: 16px;
        align-items: center;
      }

      .thumbnail {
        width: 100px;
        height: 100px;
        object-fit: cover;
        border-radius: 4px;
      }

      .product-info {
        flex: 1;
      }

      .product-info h3 {
        margin: 0 0 8px 0;
        font-size: 16px;
      }

      .product-info p {
        margin: 4px 0;
        font-size: 13px;
        color: #555;
      }

      .controls {
        margin-top: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .decrease,
      .increase {
        cursor: pointer;
        padding: 4px 10px;
        font-size: 14px;
      }

      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .total-price {
        font-weight: bold;
        font-size: 16px;
      }
    </style>
  </head>

  <body>
    <section class="products-wrapper">
      <input
        type="text"
        placeholder="Search product..."
        class="search-value"
      />

      <div class="products">
        <div class="products-list"></div>

        <div class="cart-summary">
          <div class="total-price">Total Price: 0 GEL</div>
        </div>
      </div>
    </section>

    <script src="./index.js"></script>
  </body>
</html>
